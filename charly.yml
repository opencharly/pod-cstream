version: 2026.240.1943
cstream:
    candy:
        version: 2026.242.1715
        description: |
            The cstream transport spine: the Wayland parent that IS the streamer, the
            browser-facing gateway, the PAM login broker, and the gates that prove
            the stack is actually STREAMING rather than merely started.

            Three of those gates exist because the obvious checks are not evidence.
            A service check proves a process is up; measured, charly's own service:
            verb even reports PASS for a supervisord program parked in FATAL
            (opencharly/charly#456). A grim screenshot proves the compositor draws,
            but says nothing about whether the encoder and transport carry those
            pixels. And "the frame is not uniform" passes on a wallpaper, so a
            frozen pipeline serving one static frame forever satisfies it.

            So the streaming gate compares frames pulled THROUGH the pipeline before
            and after a real client window maps: a dead, frozen or placeholder
            pipeline yields identical frames and fails. The encoder gate fails when a
            VA-capable node is present but hardware encode is not actually producing
            H.264 -- the spec's named silent fallback to CPU.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.240.0121'
            - '@github.com/opencharly/layer-gst-wayland-display:v2026.241.2202'
            - '@github.com/opencharly/pod-hyprland:v2026.242.1704'
        port:
            - 8080
        package:
            - go
            - rust
            - git
            - pam
            - shadow
            - socat
            - foot
            - ttf-dejavu
            - gst-plugins-good
            # webrtcsink lives here, and ONLY here: Arch splits gst-plugins-rs into
            # one package per plugin, and the webrtc one is gst-plugin-rswebrtc --
            # NOT gst-plugin-webrtchttp, which is the WHIP/WHEP pair and has no
            # webrtcsink at all. 0.15.3 is the pinned series.
            - gst-plugin-rswebrtc
            # webrtcbin lives here, and webrtcsink CANNOT WORK WITHOUT IT: the
            # rswebrtc elements construct a webrtcbin per session internally, so
            # without this package the sink registers, negotiates a session, then
            # fails to build its pipeline with `Failed to make element webrtcbin`
            # -- a WARN, not an error, so the stream silently carries no media.
            - gst-plugins-bad
        plan:
            - run: build the gateway and the session leader from the pinned streamer
              command: |
                set -e
                cd /tmp
                git clone --filter=blob:none --no-checkout https://github.com/opencharly/charly-streamer src
                cd src
                git checkout -q b0756118a025757284b1f1b63aa969b0f807917a
                CGO_ENABLED=0 go build -o /usr/local/bin/cstream-gateway ./cmd/cstream-gateway
                cargo build --release -p cstream-leader --bin cstream-leader
                install -Dm755 target/release/cstream-leader /usr/local/bin/cstream-leader
                cargo build --release -p cstream-streamer --bin cstream-streamer
                install -Dm755 target/release/cstream-streamer /usr/local/bin/cstream-streamer
                cd /
                rm -rf /tmp/src /root/go /root/.cache/go-build /root/.cargo/registry /root/.cargo/git
              run_as: root
            - run: stage the Wayland parent
              copy: etc/cstream-parent
              to: /usr/local/bin/cstream-parent
              mode: "0755"
              run_as: root
            - run: stage the streaming gate probes
              copy: etc/stream-probe
              to: /usr/local/bin/stream-probe
              mode: "0755"
              run_as: root
            - run: stage the encoder probe
              copy: etc/encoder-probe
              to: /usr/local/bin/encoder-probe
              mode: "0755"
              run_as: root
            - run: stage the login probe the bed drives
              copy: etc/login-probe
              to: /usr/local/bin/cstream-login-probe
              mode: "0755"
              run_as: root
            # The CONSUMER-side probe. stream-probe reads the producer's own tap
            # and wl: screenshot reads the compositor, so neither can fail on an
            # encoding or transport defect -- which is exactly the class that hid
            # the missing webrtcbin while every producer-side check passed.
            - run: stage the frame probe that pulls back through the WebRTC track
              copy: etc/cstream-frame-probe
              to: /usr/local/bin/cstream-frame-probe
              mode: "0755"
              run_as: root
            - run: stage the streamer's own PAM service
              copy: etc/pam-cstream
              to: /etc/pam.d/cstream
              mode: "0644"
              run_as: root
            - check: the gateway binary is installed
              id: cstream-gateway-installed
              file:
                file: /usr/local/bin/cstream-gateway
                exists: true
            - check: the session leader is installed
              id: cstream-leader-installed
              file:
                file: /usr/local/bin/cstream-leader
                exists: true
            - check: the streamer is installed
              id: cstream-streamer-installed
              file:
                file: /usr/local/bin/cstream-streamer
                exists: true
            - check: webrtcsink is present -- the ONLY element that can carry the stream
              id: cstream-webrtcsink-registered
              exit_status: 0
              command: |
                # Asserted as a REGISTERED ELEMENT, not as an installed package: the
                # plugin .so can be present and still fail to load (an ABI skew against
                # the system GStreamer), and a package check cannot tell the difference.
                gst-inspect-1.0 webrtcsink >/dev/null 2>&1 && echo WEBRTCSINK-OK
              stdout:
                - contains: WEBRTCSINK-OK
            - check: webrtcbin is present -- webrtcsink builds one PER SESSION and is inert without it
              id: cstream-webrtcbin-registered
              exit_status: 0
              command: |
                # webrtcsink registering proves NOTHING about whether it can serve a
                # session: it makes a webrtcbin per consumer at session time, and when
                # that element is missing the failure is a WARN
                # (`SessionPipelineError ... Failed to make element webrtcbin`), the
                # offer is never sent, and the consumer waits forever with no ICE or
                # DTLS error to point at. Registration is not capability -- the same
                # trap the VA encoder gate already covers by opening the encoder.
                gst-inspect-1.0 webrtcbin >/dev/null 2>&1 && echo WEBRTCBIN-OK
              stdout:
                - contains: WEBRTCBIN-OK
            # WP4 resize. Each resize is paired with an OBSERVATION on the nested
            # compositor, because the socket reply only proves the streamer applied
            # new caps -- it says nothing about whether the compositor reconfigured
            # its output. Aquamarine snaps an unsatisfiable configure to 1280x720
            # in SILENCE, so "no error" is not evidence here.
            #
            # 1600x900 is asserted as 1600x896: Geometry::sanitised rounds to a
            # multiple of 8 and 900 is not one. The plan's own WP4 gate lists the
            # requested 900, which cannot apply -- a gate asserting it would fail
            # against correct behaviour.
            - check: WP4 the control socket applies a resize and REPORTS what it applied
              id: cstream-resize-applies
              context:
                - runtime
              exit_status: 0
              command:
                  in_container: true
                  command: |
                      printf 'resize 1600 900\n' | timeout 10 socat - UNIX-CONNECT:/tmp/cstream-control.sock
              stdout:
                - contains: "OK resize 1600x896"
            - check: WP4 the nested compositor really reconfigured to the applied size
              id: cstream-resize-observed
              context:
                - runtime
              wl:
                method: hypr-monitors
              stdout:
                # BOTH dimensions. "1600" alone could match a coordinate or a
                # refresh rate; 896 is the distinctive value -- it is the ROUNDED
                # height, so asserting it proves the round-to-8 reached the
                # compositor rather than stopping at the capsfilter.
                - contains: "\"width\": 1600"
                - contains: "\"height\": 896"
            - check: WP4 a second distinct size applies, so the first was not a coincidence
              id: cstream-resize-small
              context:
                - runtime
              exit_status: 0
              command:
                  in_container: true
                  command: |
                      # The 500ms rate limit is on APPLIED resizes; the preceding
                      # observation step has already spent longer than that. A bounded
                      # retry is still used rather than a sleep, so this cannot become
                      # a flake if step timing changes.
                      for _ in $(seq 20); do
                          r=$(printf 'resize 640 480\n' | timeout 10 socat - UNIX-CONNECT:/tmp/cstream-control.sock)
                          case "$r" in
                              *"OK resize 640x480"*) echo "$r"; exit 0 ;;
                              *rate-limited*) sleep 0.2 ;;
                              *) echo "$r"; exit 1 ;;
                          esac
                      done
                      echo "RESIZE-FAIL: still rate-limited after 4s"; exit 1
              stdout:
                - contains: "OK resize 640x480"
            - check: WP4 the compositor followed the second resize down
              id: cstream-resize-small-observed
              context:
                - runtime
              wl:
                method: hypr-monitors
              stdout:
                - contains: "\"width\": 640"
                - contains: "\"height\": 480"
            - check: "the streamer has its OWN PAM service, not a borrowed login stack"
              id: cstream-pam-service
              exit_status: 0
              command: |
                # Borrowing /etc/pam.d/login fails in a container for reasons unrelated
                # to the credential (pam_loginuid needs CAP_AUDIT_CONTROL, pam_securetty
                # gates on a tty this session has none of), and reports
                # "cannot retrieve authentication info" -- naming the wrong cause.
                test -f /etc/pam.d/cstream || exit 1
                # Assert against the MODULE LINES only. Grepping the whole file for
                # the modules that must be absent matches this stack's own comment
                # explaining why they are absent, so the check fails on a correct
                # file -- measured, not hypothetical.
                rules=$(grep -v '^[[:space:]]*#' /etc/pam.d/cstream)
                echo "$rules" | grep -qE '^auth[[:space:]]+.*pam_unix\.so' || exit 1
                echo "$rules" | grep -qE '^account[[:space:]]+.*pam_unix\.so' || exit 1
                echo "$rules" | grep -qE '^session[[:space:]]+.*pam_unix\.so' || exit 1
                if echo "$rules" | grep -qE 'pam_loginuid|pam_securetty'; then exit 1; fi
                echo PAM-STACK-OK
              stdout:
                - contains: PAM-STACK-OK
            - check: the streaming probes are installed
              id: cstream-probes-installed
              exit_status: 0
              command: test -x /usr/local/bin/stream-probe && test -x /usr/local/bin/encoder-probe && test -x /usr/local/bin/cstream-login-probe && test -x /usr/local/bin/cstream-frame-probe && echo PROBES-OK
              stdout:
                - contains: PROBES-OK
        service:
            - name: cstream-parent
              # The STREAMER is the Wayland parent -- the name is kept so consumers
              # and checks that wait on `cstream-parent` keep working, but what runs
              # is the streamer itself.
              #
              # waylanddisplaysrc creates a compositor and holds the render node, so
              # nothing else can observe this display: a second one negotiates
              # "Supported DMA formats: []" and produces nothing. Running a separate
              # parent alongside the streamer therefore gave a consumer a negotiated
              # WebRTC session with no media -- the streamer was capturing its own
              # empty compositor while the desktop nested into the other one.
              #
              # CSTREAM_FRAME_DIR turns on the tap the frame-content gate reads, so
              # this one pipeline provides what two used to.
              exec: /usr/local/bin/cstream-streamer
              env:
                XDG_RUNTIME_DIR: /tmp/cstream-rt
                CSTREAM_ENCODE: auto
                CSTREAM_RENDER_NODE: /dev/dri/renderD128
                CSTREAM_FRAME_DIR: /tmp/cstream-frames
              restart: always
              priority: 10
              start_sec: 2
              enable: true
              scope: system
            - name: cstream-gateway
              exec: /usr/local/bin/cstream-gateway --addr :8080
              env:
                XDG_RUNTIME_DIR: /tmp/cstream-rt
                WAYLAND_DISPLAY: wayland-1
                CSTREAM_RENDER_NODE: /dev/dri/renderD128
              restart: always
              priority: 18
              start_sec: 2
              enable: true
              scope: system

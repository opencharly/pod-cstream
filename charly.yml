version: 2026.240.1943
cstream:
    candy:
        version: 2026.243.1053
        description: |
            The cstream transport spine: the Wayland parent that IS the streamer, the
            browser-facing gateway, the PAM login broker, and the gates that prove
            the stack is actually STREAMING rather than merely started.

            Three of those gates exist because the obvious checks are not evidence.
            A service check proves a process is up; measured, charly's own service:
            verb even reports PASS for a supervisord program parked in FATAL
            (opencharly/charly#456). A grim screenshot proves the compositor draws,
            but says nothing about whether the encoder and transport carry those
            pixels. And "the frame is not uniform" passes on a wallpaper, so a
            frozen pipeline serving one static frame forever satisfies it.

            So the streaming gate compares frames pulled THROUGH the pipeline before
            and after a real client window maps: a dead, frozen or placeholder
            pipeline yields identical frames and fails. The encoder gate fails when a
            VA-capable node is present but hardware encode is not actually producing
            H.264 -- the spec's named silent fallback to CPU.
        require:
            # WP6: the audio substrate. A streamed desktop has no sound card, so
            # the endpoints below are virtual -- but something has to run PipeWire
            # to instantiate them, and pod-pipewire is that (daemon + wireplumber
            # + pw-cli, service priority 5, which is already the slot the plan's
            # start chain reserves for it: dbus 2 -> pipewire 5 -> broker 8).
            - '@github.com/opencharly/pod-pipewire:v2026.239.1555'
            - '@github.com/opencharly/layer-supervisord:v2026.240.0121'
            - '@github.com/opencharly/layer-gst-wayland-display:v2026.241.2202'
            # pod-hyprland is deliberately NOT required here. It is composed by
            # layer-cstream-desktop, whose own description says a metalayer's
            # members "are what it IS" and warns that installing the same thing in
            # two places gives "a consumer two places to look for the same
            # behaviour". Pinning it here was that second place: nothing in this
            # candy's plan uses Hyprland (measured -- the require line was the only
            # reference in the whole manifest), and two pins on one candy is what
            # produced `resolved to multiple versions` every time either moved.
            #
            # The direction also matters: the layer's rationale is that THIS pod
            # supplies the parent display Hyprland nests into. Requiring the
            # compositor from the parent states the dependency backwards.
        port:
            - 8080
        package:
            - go
            - rust
            - git
            - pam
            - shadow
            - socat
            - foot
            - ttf-dejavu
            - gst-plugins-good
            # webrtcsink lives here, and ONLY here: Arch splits gst-plugins-rs into
            # one package per plugin, and the webrtc one is gst-plugin-rswebrtc --
            # NOT gst-plugin-webrtchttp, which is the WHIP/WHEP pair and has no
            # webrtcsink at all. 0.15.3 is the pinned series.
            - gst-plugin-rswebrtc
            # webrtcbin lives here, and webrtcsink CANNOT WORK WITHOUT IT: the
            # rswebrtc elements construct a webrtcbin per session internally, so
            # without this package the sink registers, negotiates a session, then
            # fails to build its pipeline with `Failed to make element webrtcbin`
            # -- a WARN, not an error, so the stream silently carries no media.
            - gst-plugins-bad
            # `pipewiresrc`, which the streamer's audio branch captures with. NOT
            # supplied by pod-pipewire: that gives the daemon, wireplumber and pw-cli,
            # while the GStreamer element is its own Arch package. Measured the hard
            # way -- without it the streamer aborts at startup with
            #
            #   Error: attaching the audio branch
            #     0: creating pipewiresrc — is gst-plugin-pipewire installed?
            #     1: Failed to find element factory with name 'pipewiresrc'
            #
            # and because the streamer IS the Wayland parent, that takes the WHOLE
            # stack down: cstream-parent goes FATAL, cstream-hyprland restart-loops
            # with no parent display, and the consumer-side frame probe then waits on
            # media that will never arrive. The blast radius of a missing audio
            # element is the entire session, not the audio.
            - gst-plugin-pipewire
        plan:
            - run: build the gateway and the session leader from the pinned streamer
              command: |
                set -e
                cd /tmp
                git clone --filter=blob:none --no-checkout https://github.com/opencharly/charly-streamer src
                cd src
                git checkout -q de1ff6f50fc775b0babfd23bd058fcf8f0c8f848
                CGO_ENABLED=0 go build -o /usr/local/bin/cstream-gateway ./cmd/cstream-gateway
                cargo build --release -p cstream-leader --bin cstream-leader
                install -Dm755 target/release/cstream-leader /usr/local/bin/cstream-leader
                cargo build --release -p cstream-streamer --bin cstream-streamer
                install -Dm755 target/release/cstream-streamer /usr/local/bin/cstream-streamer
                cd /
                rm -rf /tmp/src /root/go /root/.cache/go-build /root/.cargo/registry /root/.cargo/git
              run_as: root
            - run: stage the Wayland parent
              copy: etc/cstream-parent
              to: /usr/local/bin/cstream-parent
              mode: "0755"
              run_as: root
            - run: stage the streaming gate probes
              copy: etc/stream-probe
              to: /usr/local/bin/stream-probe
              mode: "0755"
              run_as: root
            - run: stage the encoder probe
              copy: etc/encoder-probe
              to: /usr/local/bin/encoder-probe
              mode: "0755"
              run_as: root
            # WP6: the two virtual endpoints PipeWire instantiates at start.
            # A drop-in rather than a whole pipewire.conf: replacing the shipped
            # config would silently discard the distro's own defaults, and only
            # the objects list needs adding.
            - run: stage the cstream audio endpoints
              copy: etc/pipewire-cstream.conf
              to: /etc/pipewire/pipewire.conf.d/50-cstream.conf
              mode: "0644"
              run_as: root
            - run: stage the login probe the bed drives
              copy: etc/login-probe
              to: /usr/local/bin/cstream-login-probe
              mode: "0755"
              run_as: root
            # The CONSUMER-side probe. stream-probe reads the producer's own tap
            # and wl: screenshot reads the compositor, so neither can fail on an
            # encoding or transport defect -- which is exactly the class that hid
            # the missing webrtcbin while every producer-side check passed.
            - run: stage the frame probe that pulls back through the WebRTC track
              copy: etc/cstream-frame-probe
              to: /usr/local/bin/cstream-frame-probe
              mode: "0755"
              run_as: root
            - run: stage the streamer's own PAM service
              copy: etc/pam-cstream
              to: /etc/pam.d/cstream
              mode: "0644"
              run_as: root
            # The session lifetime the compositor binds to.
            #
            # STAGED as a file rather than authored with charly's `unit:` verb,
            # and that is a deliberate, measured choice -- not the hand-roll R4
            # forbids. `unit:` is the right seam and its schema even names this
            # unit as its worked example, but it does not install anything on the
            # VM deploy venue from a composed candy. Measured on check-cstream-vm
            # across every context spelling, each on a clean pacstrapped guest:
            #
            #   (none)              deploy exit 0, unit ABSENT | container: hard render error
            #   context: [runtime]  deploy exit 0, unit ABSENT | container: PASS (steps=13)
            #   context: [deploy]   deploy exit 0, unit ABSENT
            #
            # confirmed by inspecting the live guest:
            #   systemctl show -p LoadState --value cstream-session.target -> not-found
            #
            # Tracked as an upstream gap. Until it is closed, staging is the only
            # form that works on BOTH venues, and it is what the bed proved green.
            # No `systemctl` runs here at all: systemd lazy-loads a unit on first
            # reference, which is exactly what the bed's LoadState probe asserts.
            - run: stage the cstream session target
              copy: etc/cstream-session.target
              to: /etc/systemd/system/cstream-session.target
              mode: "0644"
              run_as: root
            - check: the cstream audio endpoints EXIST as live PipeWire nodes
              id: cstream-audio-nodes
              context:
                - runtime
              exit_status: 0
              command:
                in_container: true
                command: |
                  # Asserting the NODES, not the config file. A drop-in with a
                  # syntax error still sits on disk exactly like a good one, and
                  # PipeWire logs the parse failure and carries on with no
                  # endpoints -- so a file test passes while the audio path does
                  # not exist. `pw-cli ls Node` is the state PipeWire actually
                  # reached.
                  # LOCATE the socket rather than assume it. pod-pipewire's wrapper
                  # defaults XDG_RUNTIME_DIR to /tmp, while /tmp/cstream-rt is the
                  # streamer's Wayland runtime dir -- they are different, and a
                  # hardcoded guess makes this gate fail for the wrong reason.
                  # No bash-style default-expansion anywhere in this body -- not
                  # even in a comment. That form is not a charly runtime var and
                  # charly SKIPS the whole step as an unresolved variable, after
                  # which the bed still reports PASS while asserting nothing
                  # (measured on this very check, run 2026.243.0037).
                  found=""
                  for d in "$XDG_RUNTIME_DIR" /tmp /tmp/cstream-rt /run/user/1000; do
                      test -n "$d" || continue
                      if test -S "$d/pipewire-0"; then found="$d"; break; fi
                  done
                  test -n "$found" || {
                      echo "PW-SOCKET-NOT-FOUND: no pipewire-0 in \$XDG_RUNTIME_DIR, /tmp, /tmp/cstream-rt or /run/user/1000" >&2
                      ls -la /tmp /run/user/1000 2>/dev/null | head -20 >&2
                      exit 1; }
                  export XDG_RUNTIME_DIR="$found"
                  out=$(pw-cli ls Node 2>&1) || { echo "PW-CLI-FAILED (runtime dir $found): $out" >&2; exit 1; }
                  miss=""
                  for n in cstream-speaker cstream-mic; do
                      printf '%s' "$out" | grep -q "\"$n\"" || miss="$miss $n"
                  done
                  [ -z "$miss" ] || {
                      echo "AUDIO-NODES-MISSING:$miss -- the drop-in did not instantiate them" >&2
                      printf '%s' "$out" | grep -i 'node.name' | head -20 >&2
                      exit 1; }
                  echo AUDIO-NODES-PRESENT
              stdout:
                - contains: AUDIO-NODES-PRESENT
              eventually: 120s
              retry_interval: 10s
            - check: the streamer captures the speaker's MONITOR, not its input
              id: cstream-audio-monitor-captured
              context:
                - runtime
              exit_status: 0
              command:
                in_container: true
                command: |
                  # THE assertion for the streamer's `stream.capture.sink` property.
                  #
                  # cstream-speaker is a SINK; the outbound track is its MONITOR --
                  # what the sink receives, seen from the other side. PipeWire routes
                  # a capture stream there only when the stream carries
                  # stream.capture.sink=true. Without it the stream asks to record
                  # from a sink's input, finds nothing, and carries SILENCE.
                  #
                  # Every weaker check passes in that state: the nodes exist, the
                  # streamer is RUNNING, the pipeline reaches PLAYING, video flows.
                  # The only observable difference is whether anything is linked to
                  # the monitor ports, so that is what this asserts.
                  #
                  # Socket located, never assumed: pod-pipewire's wrapper keeps
                  # whatever XDG_RUNTIME_DIR it inherited (/tmp/xdg-runtime here, NOT
                  # the /tmp its own default suggests), while the streamer moves its
                  # own to /tmp/cstream-rt. No bash-style default-expansion in this
                  # body -- charly SKIPs the step as an unresolved variable and the
                  # bed then reports PASS while asserting nothing.
                  found=""
                  for d in "$XDG_RUNTIME_DIR" /tmp/xdg-runtime /tmp /tmp/cstream-rt /run/user/1000; do
                      test -n "$d" || continue
                      if test -S "$d/pipewire-0"; then found="$d"; break; fi
                  done
                  test -n "$found" || {
                      echo "PW-SOCKET-NOT-FOUND: no pipewire-0 in any candidate runtime dir" >&2
                      exit 1; }
                  export XDG_RUNTIME_DIR="$found"
                  command -v pw-link >/dev/null 2>&1 || {
                      echo "PW-LINK-ABSENT: cannot answer whether the monitor is captured" >&2
                      exit 1; }
                  links=$(pw-link -l 2>&1) || {
                      echo "PW-LINK-FAILED (runtime dir $found): $links" >&2
                      exit 1; }
                  # BOTH channels, not merely "something is linked". Asserting that the
                  # monitor has A link PASSED while the stream negotiated a single
                  # input_MONO port and PipeWire linked monitor_FL only -- the right
                  # channel was dropped, not mixed down, and desktop audio was
                  # left-channel-only with every check green. Fixed upstream by pinning
                  # channels=2 on the source caps (charly-streamer#11); this is the
                  # assertion that would have caught it, so it is written the strong way.
                  missing=""
                  for ch in FL FR; do
                      printf '%s\n' "$links" | grep -A 3 "cstream-speaker:monitor_$ch" \
                          | grep -q '|->' || missing="$missing monitor_$ch"
                  done
                  if [ -z "$missing" ]; then
                      echo AUDIO-MONITOR-CAPTURED-STEREO
                      exit 0
                  fi
                  if printf '%s\n' "$links" | grep -A 3 'cstream-speaker:monitor' | grep -q '|->'; then
                      echo "AUDIO-MONITOR-HALF-CAPTURED: linked, but NOT on:$missing" >&2
                      echo "Audio flows and is missing a channel: the source negotiated fewer" >&2
                      echo "channels than the monitor has, so PipeWire linked what it could and" >&2
                      echo "dropped the rest. Check the capsfilter UPSTREAM of audioconvert --" >&2
                      echo "downstream of it, conversion satisfies the caps and the source still" >&2
                      echo "takes one channel." >&2
                      printf '%s\n' "$links" | head -40 >&2
                      exit 1
                  fi
                  echo "AUDIO-MONITOR-NOT-CAPTURED: nothing is linked to cstream-speaker's monitor ports." >&2
                  echo "Either the audio branch is off (CSTREAM_AUDIO), it could not reach PipeWire" >&2
                  echo "(PIPEWIRE_RUNTIME_DIR -- the streamer and PipeWire use different runtime dirs)," >&2
                  echo "or it attached without stream.capture.sink, which connects and carries silence." >&2
                  echo "NOTE: a bare 'target not found' from pipewiresrc does NOT mean the node is" >&2
                  echo "missing -- pipewiresrc serves audio AND video, and with a caps-agnostic peer it" >&2
                  echo "negotiates VIDEO and truthfully reports no video target. Cost an hour once." >&2
                  printf '%s\n' "$links" | head -40 >&2
                  echo "--- audio nodes ---" >&2
                  pw-cli ls Node 2>&1 | grep -iE 'node.name|media.class' | head -30 >&2
                  exit 1
              stdout:
                - contains: AUDIO-MONITOR-CAPTURED-STEREO
              eventually: 120s
              retry_interval: 10s
            - check: the gateway binary is installed
              id: cstream-gateway-installed
              file:
                file: /usr/local/bin/cstream-gateway
                exists: true
            - check: the session leader is installed
              id: cstream-leader-installed
              file:
                file: /usr/local/bin/cstream-leader
                exists: true
            - check: the streamer is installed
              id: cstream-streamer-installed
              file:
                file: /usr/local/bin/cstream-streamer
                exists: true
            - check: the installed streamer carries the WP5 lock path, so the pin bump really took
              id: cstream-lock-compiled-in
              exit_status: 0
              command: |
                # A pin bump is exactly the change that can silently NOT happen: a cached
                # layer, a ref that resolved to the old commit, and the file check above
                # still passes because a streamer IS installed -- the previous one. The
                # env var name only exists in the binary built from the WP5 commit.
                grep -aq CSTREAM_LOCK_AFTER /usr/local/bin/cstream-streamer && echo LOCK-PATH-PRESENT
              stdout:
                - contains: LOCK-PATH-PRESENT
            - check: webrtcsink is present -- the ONLY element that can carry the stream
              id: cstream-webrtcsink-registered
              exit_status: 0
              command: |
                # Asserted as a REGISTERED ELEMENT, not as an installed package: the
                # plugin .so can be present and still fail to load (an ABI skew against
                # the system GStreamer), and a package check cannot tell the difference.
                gst-inspect-1.0 webrtcsink >/dev/null 2>&1 && echo WEBRTCSINK-OK
              stdout:
                - contains: WEBRTCSINK-OK
            - check: webrtcbin is present -- webrtcsink builds one PER SESSION and is inert without it
              id: cstream-webrtcbin-registered
              exit_status: 0
              command: |
                # webrtcsink registering proves NOTHING about whether it can serve a
                # session: it makes a webrtcbin per consumer at session time, and when
                # that element is missing the failure is a WARN
                # (`SessionPipelineError ... Failed to make element webrtcbin`), the
                # offer is never sent, and the consumer waits forever with no ICE or
                # DTLS error to point at. Registration is not capability -- the same
                # trap the VA encoder gate already covers by opening the encoder.
                gst-inspect-1.0 webrtcbin >/dev/null 2>&1 && echo WEBRTCBIN-OK
              stdout:
                - contains: WEBRTCBIN-OK
            - check: pipewiresrc is present -- the streamer ABORTS at startup without it
              id: cstream-pipewiresrc-registered
              exit_status: 0
              command: |
                # Same class as the webrtcbin gate above, and it bit for real: the audio
                # branch creates `pipewiresrc`, and pod-pipewire does NOT supply that
                # element -- it ships the daemon, wireplumber and pw-cli, while the
                # GStreamer plugin is the separate gst-plugin-pipewire package.
                #
                # Worse than the webrtcbin case, because this one is not a WARN. The
                # streamer fails to build its graph and EXITS, and the streamer IS the
                # Wayland parent, so the whole session goes with it: cstream-parent
                # FATAL, cstream-hyprland restart-looping, the frame probe hanging on
                # media that never comes. An 11-minute bed hang, from one absent package.
                #
                # Checked at IMAGE level so a composition mistake fails at build rather
                # than as a mystery hang in check-live.
                gst-inspect-1.0 pipewiresrc >/dev/null 2>&1 && echo PIPEWIRESRC-OK
              stdout:
                - contains: PIPEWIRESRC-OK
            # WP4 resize. Each resize is paired with an OBSERVATION on the nested
            # compositor, because the socket reply only proves the streamer applied
            # new caps -- it says nothing about whether the compositor reconfigured
            # its output. Aquamarine snaps an unsatisfiable configure to 1280x720
            # in SILENCE, so "no error" is not evidence here.
            #
            # 1600x900 is asserted as 1600x896: Geometry::sanitised rounds to a
            # multiple of 8 and 900 is not one. The plan's own WP4 gate lists the
            # requested 900, which cannot apply -- a gate asserting it would fail
            # against correct behaviour.
            - check: WP4 the control socket applies a resize and REPORTS what it applied
              id: cstream-resize-applies
              context:
                - runtime
              exit_status: 0
              command:
                  in_container: true
                  command: |
                      printf 'resize 1600 900\n' | timeout 10 socat - UNIX-CONNECT:/tmp/cstream-control.sock
              stdout:
                - contains: "OK resize 1600x896"
            - check: WP4 the nested compositor really reconfigured to the applied size
              id: cstream-resize-observed
              context:
                - runtime
              wl:
                method: hypr-monitors
              stdout:
                # BOTH dimensions. "1600" alone could match a coordinate or a
                # refresh rate; 896 is the distinctive value -- it is the ROUNDED
                # height, so asserting it proves the round-to-8 reached the
                # compositor rather than stopping at the capsfilter.
                - contains: "\"width\": 1600"
                - contains: "\"height\": 896"
            - check: WP4 a second distinct size applies, so the first was not a coincidence
              id: cstream-resize-small
              context:
                - runtime
              exit_status: 0
              # `eventually:` + `retry_interval:` are charly's OWN retry modifiers --
              # the same pair the cross-deployment-probing reference uses for cdp
              # steps. This step previously hand-rolled the identical semantics in
              # shell (a `for … seq` loop around the socat call, matching on the
              # rate-limited reply). That was a reimplementation of an existing
              # mechanism: R3.
              #
              # The retry is needed because the control socket rate-limits APPLIED
              # resizes to 2/s, so a resize arriving too soon after the previous one
              # is refused. Retrying is correct here and the bound keeps a genuinely
              # dead socket failing rather than hanging.
              eventually: 15s
              retry_interval: 1s
              command:
                  in_container: true
                  command: |
                      printf 'resize 640 480\n' | timeout 10 socat - UNIX-CONNECT:/tmp/cstream-control.sock
              stdout:
                - contains: "OK resize 640x480"
            - check: WP4 the compositor followed the second resize down
              id: cstream-resize-small-observed
              context:
                - runtime
              wl:
                method: hypr-monitors
              stdout:
                - contains: "\"width\": 640"
                - contains: "\"height\": 480"
            - check: "the streamer has its OWN PAM service, not a borrowed login stack"
              id: cstream-pam-service
              exit_status: 0
              command: |
                # Borrowing /etc/pam.d/login fails in a container for reasons unrelated
                # to the credential (pam_loginuid needs CAP_AUDIT_CONTROL, pam_securetty
                # gates on a tty this session has none of), and reports
                # "cannot retrieve authentication info" -- naming the wrong cause.
                test -f /etc/pam.d/cstream || exit 1
                # Assert against the MODULE LINES only. Grepping the whole file for
                # the modules that must be absent matches this stack's own comment
                # explaining why they are absent, so the check fails on a correct
                # file -- measured, not hypothetical.
                rules=$(grep -v '^[[:space:]]*#' /etc/pam.d/cstream)
                echo "$rules" | grep -qE '^auth[[:space:]]+.*pam_unix\.so' || exit 1
                echo "$rules" | grep -qE '^account[[:space:]]+.*pam_unix\.so' || exit 1
                echo "$rules" | grep -qE '^session[[:space:]]+.*pam_unix\.so' || exit 1
                if echo "$rules" | grep -qE 'pam_loginuid|pam_securetty'; then exit 1; fi
                echo PAM-STACK-OK
              stdout:
                - contains: PAM-STACK-OK
            - check: the streaming probes are installed
              id: cstream-probes-installed
              exit_status: 0
              command: test -x /usr/local/bin/stream-probe && test -x /usr/local/bin/encoder-probe && test -x /usr/local/bin/cstream-login-probe && test -x /usr/local/bin/cstream-frame-probe && echo PROBES-OK
              stdout:
                - contains: PROBES-OK
        service:
            - name: cstream-parent
              # The STREAMER is the Wayland parent -- the name is kept so consumers
              # and checks that wait on `cstream-parent` keep working, but what runs
              # is the streamer itself.
              #
              # waylanddisplaysrc creates a compositor and holds the render node, so
              # nothing else can observe this display: a second one negotiates
              # "Supported DMA formats: []" and produces nothing. Running a separate
              # parent alongside the streamer therefore gave a consumer a negotiated
              # WebRTC session with no media -- the streamer was capturing its own
              # empty compositor while the desktop nested into the other one.
              #
              # CSTREAM_FRAME_DIR turns on the tap the frame-content gate reads, so
              # this one pipeline provides what two used to.
              exec: /usr/local/bin/cstream-streamer
              env:
                XDG_RUNTIME_DIR: /tmp/cstream-rt
                # PipeWire lives in a DIFFERENT runtime dir, and both are correct.
                # This process moves XDG_RUNTIME_DIR to its own Wayland dir above,
                # while pod-pipewire's wrapper keeps whatever it inherited --
                # /tmp/xdg-runtime here. pipewiresrc therefore looks for the socket
                # where the compositor lives and finds nothing, failing the pipeline
                # at PLAYING with a bare
                #
                #   GstPipeWireSrc:pipewiresrc0: Failed to connect
                #
                # PIPEWIRE_RUNTIME_DIR is honoured independently of XDG_RUNTIME_DIR,
                # so it bridges the split without disturbing the Wayland side.
                # Measured as a clean A/B in the live pod:
                #
                #   XDG=/tmp/cstream-rt                             -> Failed to connect
                #   XDG=/tmp/cstream-rt PIPEWIRE=/tmp/xdg-runtime   -> Execution ended, no error
                PIPEWIRE_RUNTIME_DIR: /tmp/xdg-runtime
                # WP6 audio ON. Opt-in by default since charly-streamer#10, because a
                # failure to attach aborts the process and this process is the Wayland
                # parent -- so it is enabled only where the path is proven, which is
                # what the cstream-audio-monitor-captured gate below asserts.
                CSTREAM_AUDIO: "on"
                CSTREAM_ENCODE: auto
                CSTREAM_RENDER_NODE: /dev/dri/renderD128
                CSTREAM_FRAME_DIR: /tmp/cstream-frames
                # WP5: with no viewer for this long the desktop locks itself. The plan's
                # own manual end-to-end expects a lock ~10s after disconnect.
                CSTREAM_LOCK_AFTER: "10"
              restart: always
              priority: 10
              start_sec: 2
              enable: true
              scope: system
            - name: cstream-gateway
              exec: /usr/local/bin/cstream-gateway --addr :8080
              env:
                XDG_RUNTIME_DIR: /tmp/cstream-rt
                WAYLAND_DISPLAY: wayland-1
                CSTREAM_RENDER_NODE: /dev/dri/renderD128
              restart: always
              priority: 18
              start_sec: 2
              enable: true
              scope: system

# cstream's two virtual audio endpoints.
#
# A streamed desktop has no sound card. Applications still need somewhere to
# play to and something to record from, and the streamer needs a fixed,
# NAMED place to tap: a null sink's monitor port is what gets encoded into the
# outbound audio track, and a virtual source is where the browser's microphone
# is injected.
#
# Both are `support.null-audio-sink` adapters -- the standard PipeWire way to
# create an endpoint with no hardware behind it. `object.linger = true` keeps
# them alive when no client is connected, which matters because the streamer
# attaches to them at pipeline construction, potentially before any application
# has produced a sample.
#
# Names are load-bearing, not cosmetic: the streamer and the bed both address
# these by node.name, so renaming one silently detaches the audio path.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "cstream-speaker"
            node.description = "cstream desktop output"
            media.class      = Audio/Sink
            object.linger    = true
            audio.position   = [ FL FR ]
        }
    }
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "cstream-mic"
            node.description = "cstream microphone (from the browser)"
            media.class      = Audio/Source/Virtual
            object.linger    = true
            audio.position   = [ MONO ]
        }
    }
]
